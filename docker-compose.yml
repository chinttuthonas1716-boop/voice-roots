version: "3.8"

services:
  # ─── Voice Roots FastAPI Backend ──────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice_roots_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - VOICE_ROOTS_ENV=production
      - VOICE_ROOTS_DB_PATH=/data/voice_roots.db
      - VOICE_ROOTS_STORAGE_DIR=/data/storage
      - VOICE_ROOTS_BACKUP_DIR=/data/backups
      - VOICE_ROOTS_CHROMA_DIR=/data/chroma_db
      - VOICE_ROOTS_TRANSCRIPTION_PROVIDER=whisper-local
      - VOICE_ROOTS_WHISPER_MODEL_SIZE=base
      - VOICE_ROOTS_TRANSLATION_PROVIDER=offline-rule
      - VOICE_ROOTS_ALLOWED_ORIGINS=http://localhost,http://localhost:5173,http://127.0.0.1:5173,http://localhost:80
    volumes:
      - voice_roots_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Voice Roots React / Vite Frontend ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voice_roots_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  voice_roots_data:
    name: voice_roots_persistent_data
