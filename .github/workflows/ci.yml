name: Voice Roots CI/CD — Production Quality Gate & Deployment

on:
  push:
    branches:
      - main
      - agent/antigravity
      - agent/codex
      - "task/**"
  pull_request:
    branches:
      - main
      - agent/antigravity
      - agent/codex
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend Pytest & Ruff Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements-render.txt"

      - name: Install System Audio Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements-test.txt
          pip install ruff

      - name: Run Ruff Linter
        run: |
          ruff check backend/

      - name: Run Backend Pytest Suite
        env:
          VOICE_ROOTS_ENV: test
          VOICE_ROOTS_STORAGE_BACKEND: local
          VOICE_ROOTS_WHISPER_MODEL_SIZE: tiny
        run: |
          pytest -v tests/test_t*.py

  frontend-quality:
    name: Frontend Typecheck & Next.js Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install Web Dependencies
        run: |
          npm ci --prefix web

      - name: Run TypeScript Typecheck
        run: |
          npm run typecheck --prefix web

      - name: Run Next.js 14 Production Build
        env:
          API_BASE_URL: https://voice-roots-api.onrender.com
        run: |
          npm run build --prefix web

  e2e-tests:
    name: Playwright End-to-End User Journey Tests
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements-render.txt"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install Backend & Audio Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements-test.txt

      - name: Start FastAPI Backend Service
        env:
          VOICE_ROOTS_ENV: test
          VOICE_ROOTS_ADMIN_KEY: voice-roots-admin-key
          PORT: 8000
        run: |
          python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
          curl -f http://localhost:8000/health || exit 1

      - name: Install Web Dependencies & Playwright Browsers
        run: |
          npm ci --prefix web
          npx --prefix web playwright install --with-deps chromium

      - name: Build Next.js Production Web
        env:
          API_BASE_URL: http://localhost:8000
        run: |
          npm run build --prefix web

      - name: Run Playwright E2E Test Suite
        env:
          API_BASE_URL: http://localhost:8000
        run: |
          npm run test:e2e --prefix web

      - name: Upload Playwright Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  deploy:
    name: Production Deployment Trigger (Render Web Services)
    needs: [backend-quality, frontend-quality, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Backend Deploy Hook
        if: env.RENDER_BACKEND_DEPLOY_HOOK != ''
        env:
          RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          curl -sS -X POST "$RENDER_BACKEND_DEPLOY_HOOK"
          echo "Render backend deploy hook successfully triggered."

      - name: Trigger Render Frontend Deploy Hook
        if: env.RENDER_FRONTEND_DEPLOY_HOOK != ''
        env:
          RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          curl -sS -X POST "$RENDER_FRONTEND_DEPLOY_HOOK"
          echo "Render frontend deploy hook successfully triggered."

      - name: Verify Live Service Availability
        run: |
          echo "Production deployment initiated. Checking live health..."
          curl -sS --max-time 15 "https://voice-roots-api.onrender.com/health" || echo "API server awaiting spin-up"
          curl -sS --max-time 15 -I "https://voice-roots.onrender.com" || echo "Frontend server awaiting spin-up"
