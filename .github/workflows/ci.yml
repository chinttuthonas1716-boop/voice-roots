name: Voice Roots CI - Automated Quality & Regression Protection

on:
  push:
    branches:
      - main
      - agent/antigravity
      - agent/codex
  pull_request:
    branches:
      - main
      - agent/antigravity
      - agent/codex
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-quality-checks:
    name: Backend Regression & Critical Workflow Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements-render.txt'

      - name: Install System Audio Engine (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-render.txt
          pip install -r backend/requirements-test.txt

      - name: Run Backend Pytest Suite (Offline Unit & Integration Tests)
        env:
          VOICE_ROOTS_TRANSCRIPTION_PROVIDER: whisper-local
          VOICE_ROOTS_WHISPER_MODEL_SIZE: tiny
        run: |
          pytest -v -m "not real_ai"

  frontend-quality-checks:
    name: Frontend Build & TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          npm ci --prefix frontend

      - name: Run Production Build (tsc && vite build)
        run: |
          npm --prefix frontend run build

