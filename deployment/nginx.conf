# Voice Roots — Production Nginx Reverse Proxy Configuration (PR-02)
# Production TLS termination, proxy buffer configuration for audio streaming, and security hardening.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format json_analytics escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Rate limiting zone for public endpoints (60 req/min per IP)
    limit_req_zone $binary_remote_addr zone=pilot_api_limit:10m rate=60r/m;

    # Upstream to Voice Roots backend
    upstream voice_roots_backend {
        server voice-roots-backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name pilot.voiceroots.ai;
        # Redirect all HTTP requests to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name pilot.voiceroots.ai;

        # TLS Certificates (Mount from Let's Encrypt / Certbot)
        ssl_certificate /etc/letsencrypt/live/pilot.voiceroots.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pilot.voiceroots.ai/privkey.pem;

        # Modern TLS Security Protocols
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers (SEC-06 / PR-02)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' http: https:;" always;

        # Audio Upload Size Limit (500MB)
        client_max_body_size 500M;

        location / {
            proxy_pass http://voice_roots_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Optimize for audio range requests and streaming
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Rate-limited research export routes
        location /api/v1/research/ {
            limit_req zone=pilot_api_limit burst=10 nodelay;
            proxy_pass http://voice_roots_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}

